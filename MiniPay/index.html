                    </div>

                </div>
                
                <!-- Finance Section -->
            <section class="hero">
                <div class="cash">
                    <div class="dollar">
                        <h2>Currency</h2>
                        <p>$0.04</p>
                    </div>
                    <div class="switch">
                        <div class="currency">
                            <h2>USD</h2>
                            <p>NGN</p>
                        </div>
                        <div class="toggle">
                            <div class="circle"></div>
                        </div>
                    </div>
                </div>
                <div class="finance-opt">
                    <div class="finance-select">
                        <div class="deposit">
                            <div class="downward">
                            </div>
                            <p>Deposit</p>
                        </div>
                        <div class="withdraw">
                            <div class="upward">
                            </div>
                            <p>Withdraw</p>
                        </div>
                    </div>
                </div>
            </section>
