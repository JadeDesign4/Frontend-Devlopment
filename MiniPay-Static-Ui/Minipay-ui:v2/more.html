<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPay Apps</title>
    <link rel="shortcut icon" href="./icons/paper-plane-solid.svg">
    <link rel="stylesheet" href="./more.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a href="./index.html" class="logo-link">
                <img class="logo" src="./img/Minipay-logo/Logo on black.png" alt="MiniPay logo">
            </a>
            <button class="mobile-menu-button" aria-expanded="false" aria-label="Open navigation menu">☰</button>
            <div class="nav-items">
                <a href="./index.html" class="nav-link">Home</a>
                <a href="./card.html" class="nav-link">Card</a>
                <a href="./share.html" class="nav-link">Share</a>
                <a href="./more.html" class="nav-link nav-link--active">Other</a>
                <a href="./extra.html" class="nav-link">Extra</a>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <section class="app-section">
            <div class="page-heading">
                <h1>MiniPay Apps</h1>
                <hr>
                <p class="page-description">Explore wallet tools and crypto purchase options.</p>
            </div>

            <div class="app-grid">
                <article class="crypto-card" data-action="Buy BTC selected. Redirect to Bitcoin purchase flow.">
                    <img src="./img/kanchanara-rhm7H8X5J98-unsplash.jpg" alt="Bitcoin image">
                    <h2>Buy BTC</h2>
                    <p>Instant & free</p>
                </article>
                <article class="crypto-card" data-action="Buy ETH selected. Redirect to Ethereum purchase flow.">
                    <img src="./img/kanchanara-7cmA9ZL5dDk-unsplash.jpg" alt="Ethereum image">
                    <h2>Buy ETH</h2>
                    <p>Instant & free</p>
                </article>
                <article class="crypto-card" data-action="Buy Solana selected. Redirect to Solana purchase flow.">
                    <img src="./img/solana.jpeg" alt="Solana image">
                    <h2>Buy Solana</h2>
                    <p>Instant & free</p>
                </article>
                <article class="crypto-card" data-action="Buy CELO selected. Redirect to Celo purchase flow.">
                    <img src="./img/celo.png" alt="Celo image">
                    <h2>Buy CELO</h2>
                    <p>Instant & free</p>
                </article>
            </div>
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
