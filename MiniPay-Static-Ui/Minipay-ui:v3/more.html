<!DOCTYPE html>

<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <header class="site-header">
        <div class="nav-container">
            <nav class="site-nav" aria-label="Main navigation">
                <a href="./index.html" class="logo-link" aria-label="MiniPay home">
                    <img class="logo" src="./img/Minipay-logo/Logo on black.png" alt="MiniPay logo">
                </a>
                <button class="mobile-menu-button" type="button" aria-expanded="false" aria-label="Open navigation menu" aria-controls="nav-items">

                    <span class="close-icon" aria-hidden="true">✕</span>

                <div class="nav-items" id="nav-items">
                    <a href="./index.html" class="nav-link">Home</a>

                    <a href="./extra.html" class="nav-link">Extra</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="page-content" id="main-content">
        <section class="app-section">
            <div class="page-heading">
                <h1>MiniPay Apps</h1>
                <hr>
                <p class="page-description">Explore wallet tools and crypto purchase options.</p>
            </div>

            <div class="app-grid">
                <article class="crypto-card" data-action="Buy BTC selected. Redirect to Bitcoin purchase flow.">
                    <img src="./img/kanchanara-rhm7H8X5J98-unsplash.jpg" alt="Bitcoin image">
                    <h2>Buy BTC</h2>
                    <p>Instant & free</p>
                </article>
                <article class="crypto-card" data-action="Buy ETH selected. Redirect to Ethereum purchase flow.">
                    <img src="./img/kanchanara-7cmA9ZL5dDk-unsplash.jpg" alt="Ethereum image">
                    <h2>Buy ETH</h2>
                    <p>Instant & free</p>
                </article>
                <article class="crypto-card" data-action="Buy Solana selected. Redirect to Solana purchase flow.">
                    <img src="./img/solana.jpeg" alt="Solana image">
                    <h2>Buy Solana</h2>
                    <p>Instant & free</p>
                </article>
                <article class="crypto-card" data-action="Buy CELO selected. Redirect to Celo purchase flow.">
                    <img src="./img/celo.png" alt="Celo image">
                    <h2>Buy CELO</h2>
                    <p>Instant & free</p>
                </article>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© <span id="year">2026</span> MiniPay. All rights reserved.</p>
        <nav aria-label="Footer navigation">
            <a href="#">Privacy</a>
