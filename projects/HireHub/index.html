<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireHub - Find Your Dream Career</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container">
                <div class="logo-area">
                    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 8V6C7 4.89543 7.89543 4 9 4H15C16.1046 4 17 4.89543 17 6V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <rect x="3" y="8" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 12V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span class="app-name">HireHub</span>
                </div>
                <div class="nav-links">
                    <a href="#" class="active" id="findJobsBtn">Find Jobs</a>
                    <a href="#" id="savedJobsBtn">Saved Jobs <span id="savedCount" class="badge">0</span></a>
                </div>
                <button id="themeToggle" class="theme-btn">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </nav>

        <!-- Search Header -->
        <header class="search-header">
            <div class="container">
                <div class="search-box">
                    <div class="input-group">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="jobTitleSearch" placeholder="Job title, keywords, or company">
                    </div>
                    <div class="divider"></div>
                    <div class="input-group">
                        <i class="fa-solid fa-location-dot"></i>
                        <input type="text" id="locationSearch" placeholder="City, state, or remote">
                    </div>
                    <button id="searchBtn" class="btn-primary">Search Jobs</button>
                </div>
            </div>
        </header>

        <main class="container main-content">
            <!-- Filters Sidebar -->
            <aside class="filters-sidebar">
                <div class="filter-card">
                    <h3>Filter Results</h3>
                    
                    <div class="filter-group">
                        <label>Job Type</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" class="type-filter" value="Full-time" checked> Full-time</label>
                            <label><input type="checkbox" class="type-filter" value="Remote" checked> Remote</label>
                            <label><input type="checkbox" class="type-filter" value="Contract"> Contract</label>
                            <label><input type="checkbox" class="type-filter" value="Internship"> Internship</label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>Salary Range</label>
                        <select id="salaryFilter">
                            <option value="all">Any Salary</option>
                            <option value="50000">$50k+ per year</option>
                            <option value="80000">$80k+ per year</option>
                            <option value="120000">$120k+ per year</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Experience Level</label>
                        <select id="expFilter">
                            <option value="all">All Levels</option>
                            <option value="Junior">Junior</option>
                            <option value="Mid">Mid Level</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                </div>
            </aside>

            <!-- Job Listings -->
            <section class="job-listings">
                <div class="listings-header">
                    <h2 id="listingsTitle">Featured Jobs</h2>
                    <span id="resultsCount">0 jobs found</span>
                </div>
                <div id="jobList" class="job-list">
                    <!-- Job cards will be here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Job Detail Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
