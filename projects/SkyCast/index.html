<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.5 19C15.0147 19 13 16.9853 13 14.5C13 12.0147 15.0147 10 17.5 10C19.9853 10 22 12.0147 22 14.5C22 16.9853 19.9853 19 17.5 19Z" stroke="white" stroke-width="2"/>
                <path d="M12 15V17M12 7V9M17 12H19M7 12H9M15.5355 15.5355L16.9497 16.9497M15.5355 8.46447L16.9497 7.05025M8.46447 15.5355L7.05025 16.9497M8.46447 8.46447L7.05025 7.05025" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <path d="M2 14.5C2 12.0147 4.01472 10 6.5 10C7.38243 10 8.2041 10.2547 8.89949 10.6942C9.48782 8.57321 11.4116 7 13.7 7C16.084 7 18.0163 8.93231 18.0163 11.3163C18.0163 11.5147 18.0029 11.71 17.9768 11.901C18.2917 11.6444 18.6853 11.5 19.1163 11.5C20.1566 11.5 21 12.3434 21 13.3837C21 14.424 20.1566 15.2674 19.1163 15.2674H18" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="app-name">SkyCast</span>
        </div>
    </div>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather">
            <img src="https://openweathermap.org/img/wn/10d@2x.png" class="weather-icon" alt="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
